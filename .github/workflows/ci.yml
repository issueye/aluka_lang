name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

jobs:
  # 单元测试 + 覆盖率
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ["1.25"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: Build (CGO disabled)
        env:
          CGO_ENABLED: "0"
        run: go build -ldflags "-X main.version=ci-dev" ./...

      - name: Test
        env:
          CGO_ENABLED: "0"
        run: go test ./... -cover -coverprofile=coverage.out

      - name: Coverage summary
        if: matrix.os == 'ubuntu-latest'
        run: go tool cover -func=coverage.out | tail -1

      - name: Verify CLI smoke test
        shell: bash
        run: |
          go build -o /tmp/aluka ./cmd/aluka
          OUT=$(/tmp/aluka -e "console.log(1+1)" 2>&1)
          if [ "$OUT" != "2" ]; then
            echo "smoke test failed: got '$OUT'"
            exit 1
          fi
          /tmp/aluka --version

      # 真实环境 conformance（仅 ubuntu，需要 bash + curl；build 无外部依赖）
      - name: Build conformance (--compile)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          go build -o /tmp/aluka ./cmd/aluka
          ALUKA=/tmp/aluka bash tests/conformance/build/run.sh

      - name: Express-demo conformance
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          go build -o /tmp/aluka ./cmd/aluka
          cd demo/express-demo
          npm install --silent
          cd ../..
          ALUKA=/tmp/aluka bash tests/conformance/express/run.sh

  # JIT Linux amd64 门禁：显式覆盖 W^X、GC、异步抢占和重复运行稳定性。
  # 该 job 不替代全仓 test，而是让 Native JIT 的平台假设在真实 Linux runner 上可见地失败。
  jit-linux:
    name: JIT Linux amd64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Native JIT tests
        env:
          CGO_ENABLED: "0"
        run: go test ./internal/engine/jit/... ./internal/engine/interpreter -count=1

      # Traceability metadata: every gate below is attributable to a commit,
      # runner image and Go version (R2 integration evidence).
      - name: Traceability metadata
        run: |
          echo "commit=${{ github.sha }}"
          echo "ref=${{ github.ref }}"
          echo "runner=${{ runner.os }}/${{ runner.arch }}"
          go version

      # R2-2 W^X deep verification: published JIT regions must be RX with no
      # RWX pages anywhere in the process (VirtualQuery on Windows,
      # /proc/self/maps on Linux); multi-page, coexisting regions, failed
      # publish, double close and mapping invalidation are covered.
      - name: W^X deep verification gate
        env:
          CGO_ENABLED: "0"
        run: go test ./internal/engine/jit/native -run 'TestExecMemWX' -count=1 -v

      # R2-6 Native crash isolation: all invalid machine code executes only in
      # a child process; the parent distinguishes expected crash, timeout,
      # startup failure and unexpected success, and continues running legal
      # native code afterwards with RX accounting back at baseline.
      - name: Native crash isolation gate
        env:
          CGO_ENABLED: "0"
        run: go test ./internal/engine/jit/native -run 'TestNativeCrashIsolation' -count=1

      # R2-7 unsupported-platform fallback: Auto must reject Native publishing
      # and stably fall back to Quick/Tier 0 with results identical to JIT
      # Off and zero RX allocation. On amd64/linux this runs the platform-
      # independent fallback path; the tag-gated unsupported tests compile for
      # darwin/linux arm64 (see the build matrix).
      - name: Unsupported platform fallback gate
        env:
          CGO_ENABLED: "0"
        run: go test ./internal/engine/jit/... -run 'TestFallback|TestUnsupportedPlatform' -count=1

      - name: Native JIT race and safepoint tests
        env:
          # Go race detector requires cgo; the normal Native JIT tests above
          # remain CGO-disabled to match the shipped binary configuration.
          CGO_ENABLED: "1"
        run: >-
          go test -race ./internal/engine/jit/... ./internal/engine/interpreter
          -run 'JIT|Trace|Native|WX|CrashIsolation|Property|ArrayPush|ClosureIncrement|NativeCallback|Safepoint|OOM|ConcurrentGC|GC|Preempt|Soak|Lifecycle|Reconfigure|Close|Fallback'
          -count=1

      - name: Repeat native JIT and GC tests
        env:
          CGO_ENABLED: "0"
          GODEBUG: "asyncpreemptoff=0"
        run: >-
          go test ./internal/engine/jit/... ./internal/engine/interpreter
          -run 'JIT|Trace|Native|WX|CrashIsolation|Safepoint|OOM|ConcurrentGC|GC|Preempt|Soak|Lifecycle|Reconfigure|Fallback'
          -count=5

      # R2-3/R2-4/R2-5 gates under both GC pressure settings (soak plan §7.3:
      # rotate GOGC=20/100 alongside default async preemption).
      - name: Native stress under GOGC=20
        env:
          CGO_ENABLED: "0"
          GOGC: "20"
        run: >-
          go test ./internal/engine/jit/native ./internal/engine/interpreter
          -run 'TestNativeJIT|TestAutoJITSoakLifecycleGCAndLRU|TestAutoJITReconfigure|TestJITReconfigure|ConcurrentGC'
          -count=1

      - name: Native stress under GOGC=100
        env:
          CGO_ENABLED: "0"
          GOGC: "100"
        run: >-
          go test ./internal/engine/jit/native ./internal/engine/interpreter
          -run 'TestNativeJIT|TestAutoJITSoakLifecycleGCAndLRU|TestAutoJITReconfigure|TestJITReconfigure|ConcurrentGC'
          -count=1

      # R2-4 PR soak gate: the default (short) soak mode must pass repeatedly.
      - name: Short PR soak
        env:
          CGO_ENABLED: "0"
        run: >-
          go test ./internal/engine/interpreter
          -run '^TestAutoJITSoakLifecycleGCAndLRU$' -count=3

      # R2-4 nightly soak entry: ALUKA_JIT_SOAK=1 multiplies the soak rounds.
      # A longer soak (30-60 min) is a separate scheduled job; this step keeps
      # the extended mode exercised on every push within CI time limits.
      - name: Extended soak (nightly mode entry)
        env:
          CGO_ENABLED: "0"
          ALUKA_JIT_SOAK: "1"
        run: >-
          go test ./internal/engine/interpreter
          -run '^TestAutoJITSoakLifecycleGCAndLRU$' -count=1

      - name: Linux auto JIT CLI smoke test
        env:
          CGO_ENABLED: "0"
        shell: bash
        run: |
          go build -o /tmp/aluka ./cmd/aluka
          OUT=$(/tmp/aluka --jit=auto --jit-threshold=1 --jit-backedge-threshold=2 -e \
            'function sum(n){let t=0; for(let i=0;i<n;i++) t+=i; return t} console.log(sum(100))' 2>&1)
          test "$OUT" = "4950"

  jit-differential-nightly:
    name: JIT differential nightly
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Run 100,000-case differential
        env:
          JITDIFF_NIGHTLY: "1"
        run: >-
          go test ./internal/engine/interpreter/jitdiff
          -run '^TestDifferentialNightly$' -count=1 -v

      - name: Upload differential failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: jitdiff-failure-${{ github.run_id }}
          path: bench/results/jitdiff/
          if-no-files-found: ignore

  # Lint（仅 ubuntu）
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout 5m

  # 跨平台构建发布产物
  build:
    name: Build (${{ matrix.os }}/${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
          - os: linux
            arch: arm64
          - os: darwin
            arch: amd64
          - os: darwin
            arch: arm64
          - os: windows
            arch: amd64
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
        run: |
          mkdir -p bin
          EXT=""
          if [ "$GOOS" = "windows" ]; then EXT=".exe"; fi
          go build -ldflags "-X main.version=ci-${{ github.sha }}" \
            -o bin/aluka-${{ matrix.os }}-${{ matrix.arch }}${EXT} ./cmd/aluka

      - name: Smoke test binary
        if: matrix.os == 'linux' && matrix.arch == 'amd64'
        run: |
          OUT=$(./bin/aluka-linux-amd64 -e "console.log(42)" 2>&1)
          test "$OUT" = "42"

      # 跨平台 --compile 产物验证（B2.4.2）：同一 payload 可追加到任意平台
      # 基座（字节码平台无关）。跨平台产物无法在本机运行，验证结构：产物
      # 大于基座（payload 追加）且 footer magic 位于距文件尾 56 字节处。
      - name: Cross-platform compile artifact
        if: matrix.os == 'linux' && matrix.arch == 'amd64'
        run: |
          printf 'console.log("cross platform");\n' > /tmp/cross.ts
          ./bin/aluka-linux-amd64 build --compile \
            --base ./bin/aluka-windows-amd64.exe \
            --outfile /tmp/app-win.exe /tmp/cross.ts
          test "$(stat -c%s /tmp/app-win.exe)" -gt "$(stat -c%s ./bin/aluka-windows-amd64.exe)"
          test "$(tail -c 56 /tmp/app-win.exe | head -c 8)" = "ALUKAFTR"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: aluka-${{ matrix.os }}-${{ matrix.arch }}
          path: bin/aluka-${{ matrix.os }}-${{ matrix.arch }}*
