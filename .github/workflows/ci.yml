name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # 单元测试 + 覆盖率
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ["1.25"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: Build (CGO disabled)
        env:
          CGO_ENABLED: "0"
        run: go build -ldflags "-X main.version=ci-dev" ./...

      - name: Test
        env:
          CGO_ENABLED: "0"
        run: go test ./... -cover -coverprofile=coverage.out

      - name: Coverage summary
        if: matrix.os == 'ubuntu-latest'
        run: go tool cover -func=coverage.out | tail -1

      - name: Verify CLI smoke test
        shell: bash
        run: |
          go build -o /tmp/aluka ./cmd/aluka
          OUT=$(/tmp/aluka -e "console.log(1+1)" 2>&1)
          if [ "$OUT" != "2" ]; then
            echo "smoke test failed: got '$OUT'"
            exit 1
          fi
          /tmp/aluka --version

      # 真实环境 conformance（仅 ubuntu，需要 bash + curl；build 无外部依赖）
      - name: Build conformance (--compile)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          go build -o /tmp/aluka ./cmd/aluka
          ALUKA=/tmp/aluka bash tests/conformance/build/run.sh

      - name: Express-demo conformance
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          go build -o /tmp/aluka ./cmd/aluka
          cd demo/express-demo
          npm install --silent
          cd ../..
          ALUKA=/tmp/aluka bash tests/conformance/express/run.sh

  # Lint（仅 ubuntu）
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout 5m

  # 跨平台构建发布产物
  build:
    name: Build (${{ matrix.os }}/${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
          - os: linux
            arch: arm64
          - os: darwin
            arch: amd64
          - os: darwin
            arch: arm64
          - os: windows
            arch: amd64
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
        run: |
          mkdir -p bin
          EXT=""
          if [ "$GOOS" = "windows" ]; then EXT=".exe"; fi
          go build -ldflags "-X main.version=ci-${{ github.sha }}" \
            -o bin/aluka-${{ matrix.os }}-${{ matrix.arch }}${EXT} ./cmd/aluka

      - name: Smoke test binary
        if: matrix.os == 'linux' && matrix.arch == 'amd64'
        run: |
          OUT=$(./bin/aluka-linux-amd64 -e "console.log(42)" 2>&1)
          test "$OUT" = "42"

      # 跨平台 --compile 产物验证（B2.4.2）：同一 payload 可追加到任意平台
      # 基座（字节码平台无关）。跨平台产物无法在本机运行，验证结构：产物
      # 大于基座（payload 追加）且 footer magic 位于距文件尾 56 字节处。
      - name: Cross-platform compile artifact
        if: matrix.os == 'linux' && matrix.arch == 'amd64'
        run: |
          printf 'console.log("cross platform");\n' > /tmp/cross.ts
          ./bin/aluka-linux-amd64 build --compile \
            --base ./bin/aluka-windows-amd64.exe \
            --outfile /tmp/app-win.exe /tmp/cross.ts
          test "$(stat -c%s /tmp/app-win.exe)" -gt "$(stat -c%s ./bin/aluka-windows-amd64.exe)"
          test "$(tail -c 56 /tmp/app-win.exe | head -c 8)" = "ALUKAFTR"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: aluka-${{ matrix.os }}-${{ matrix.arch }}
          path: bin/aluka-${{ matrix.os }}-${{ matrix.arch }}*
