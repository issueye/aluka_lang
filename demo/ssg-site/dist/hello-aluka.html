        <div class="meta">发布日期: 2026-08-15 | 作者: Aluka 团队</div>
        <h1>欢迎使用 Aluka 静态构建</h1>
<p>Aluka 是一个用<strong>纯 Go</strong>实现的 JavaScript/TypeScript 运行时。</p>
<h2>特色能力</h2>
<ul>
<li><strong>自研引擎</strong>：零外部 JS 依赖</li>
<li><strong>SSG 零配置</strong>：内置 <code>aluka:markdown</code> 解析与渲染管线</li>
<li><strong>单命令生成</strong>：直接执行 TypeScript 构建脚本输出多页静态 HTML</li>
<li><strong>支持打包为独立构建工具</strong>：可使用 <code>aluka build --compile</code> 打包为免环境独立可执行构建器</li>
</ul>
    </main>
    <footer>
        <p>由 Aluka SSG 静态构建引擎自研生成</p>
    </footer>
