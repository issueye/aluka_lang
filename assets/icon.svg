<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    Aluka App Icon (Multi-Resolution Target)
  -->
  <defs>
    <radialGradient id="bg-glow-icon" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#161F36"/>
      <stop offset="60%" stop-color="#0B0E17"/>
      <stop offset="100%" stop-color="#05070B"/>
    </radialGradient>

    <linearGradient id="border-glow-icon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#7928CA" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#FF007A" stop-opacity="0.85"/>
    </linearGradient>

    <linearGradient id="facet-cyan-icon" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="50%" stop-color="#00A3FF"/>
      <stop offset="100%" stop-color="#0055FF"/>
    </linearGradient>

    <linearGradient id="facet-magenta-icon" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#FF007A"/>
      <stop offset="60%" stop-color="#7928CA"/>
      <stop offset="100%" stop-color="#4A00E0"/>
    </linearGradient>

    <linearGradient id="facet-center-icon" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="30%" stop-color="#C4F1F9"/>
      <stop offset="100%" stop-color="#00B4D8"/>
    </linearGradient>

    <linearGradient id="facet-bridge-icon" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FF007A"/>
    </linearGradient>

    <radialGradient id="inner-glow-icon" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#7928CA" stop-opacity="0"/>
    </radialGradient>

    <filter id="shadow-glow-icon" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="20" flood-color="#00F0FF" flood-opacity="0.4"/>
      <feDropShadow dx="0" dy="20" stdDeviation="32" flood-color="#FF007A" flood-opacity="0.3"/>
    </filter>

    <filter id="subtle-blur-icon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="36"/>
    </filter>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg-glow-icon)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="url(#border-glow-icon)" stroke-width="3.5" opacity="0.9"/>

  <circle cx="256" cy="256" r="160" fill="url(#inner-glow-icon)" filter="url(#subtle-blur-icon)" opacity="0.6"/>

  <g filter="url(#shadow-glow-icon)" transform="translate(0, 10)">
    <polygon points="256,70 256,186 128,370 76,370" fill="url(#facet-cyan-icon)"/>
    <polygon points="256,70 256,186 384,370 436,370" fill="url(#facet-magenta-icon)"/>
    <polygon points="256,70 204,186 308,186" fill="url(#facet-center-icon)" opacity="0.95"/>
    <polygon points="256,220 188,320 324,320" fill="#0B0E17" opacity="0.95"/>
    <polygon points="160,290 352,290 332,328 180,328" fill="url(#facet-bridge-icon)"/>

    <path d="M256 70 L256 186" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
    <path d="M256 70 L76 370" stroke="#FFFFFF" stroke-width="1.5" opacity="0.45"/>
    <path d="M256 70 L436 370" stroke="#FFFFFF" stroke-width="1.5" opacity="0.45"/>
  </g>
</svg>
