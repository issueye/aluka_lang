<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!--
    Aluka LOGO
    ──────────
    设计理念：
    · 中央菱形 = JavaScript 的标志性"倾斜方块"，被竖切为两半——
      左半 Go 蓝（#00ADD8）、右半 JS 黄（#F7DF1E），象征"用纯 Go 实现的 JS 运行时"。
    · 菱形内的 "A" = Aluka 品牌首字母，也是 Angular 风格三角 + 代码横梁，
      呼应运行时（runtime）的执行语义。
    · 深色圆角方块 + 等宽字体 "aluka" = 开发者工具/CLI 气质。
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171C28"/>
      <stop offset="1" stop-color="#0C0F16"/>
    </linearGradient>
    <linearGradient id="go" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5FD8F5"/>
      <stop offset="1" stop-color="#00ADD8"/>
    </linearGradient>
    <linearGradient id="js" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFE859"/>
      <stop offset="1" stop-color="#F7DF1E"/>
    </linearGradient>
  </defs>

  <!-- 背景圆角方块 -->
  <rect x="10" y="10" width="236" height="236" rx="56" fill="url(#bg)" stroke="#2B3346" stroke-width="3"/>

  <!-- 菱形左半：Go 蓝 -->
  <path d="M128 58 L198 128 L128 198 L128 128 Z" fill="url(#go)"/>
  <!-- 菱形右半：JS 黄 -->
  <path d="M128 58 L58 128 L128 198 L128 128 Z" fill="url(#js)"/>

  <!-- 菱形内的 "A"（品牌首字母） -->
  <path d="M128 90 L101 172" stroke="#0D1117" stroke-width="13" stroke-linecap="round" fill="none"/>
  <path d="M128 90 L155 172" stroke="#0D1117" stroke-width="13" stroke-linecap="round" fill="none"/>
  <path d="M109 140 L147 140" stroke="#0D1117" stroke-width="13" stroke-linecap="round" fill="none"/>

  <!-- 底部字标 -->
  <text x="128" y="238" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="26" font-weight="700" letter-spacing="7" text-anchor="middle"
        fill="#7C8699">ALUKA</text>
</svg>
