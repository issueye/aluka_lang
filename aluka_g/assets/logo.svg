<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    Aluka Brand Visual Identity 2.0
    ─────────────────────────────────────────────
    Design Philosophy:
    · Polyhedral Prism "A": Futuristic, high-performance prism symbolizing
      light-speed execution, JIT compilation, and zero-overhead architecture.
    · Cyber Blue & Electric Magenta: The left energetic facet represents
      pure Go's robust efficiency; the right dynamic facet represents the
      infinite flexibility of the JavaScript/TypeScript ecosystem.
    · Deep Space Backdrop: Modern dark glassmorphism with subtle glow.
  -->
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bg-glow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#161F36"/>
      <stop offset="60%" stop-color="#0B0E17"/>
      <stop offset="100%" stop-color="#05070B"/>
    </radialGradient>

    <!-- Outer Border Glow -->
    <linearGradient id="border-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#7928CA" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#FF007A" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Core Facet Gradients -->
    <!-- Left Wing: Pure Go Cyber Cyan / Electric Blue -->
    <linearGradient id="facet-cyan" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="50%" stop-color="#00A3FF"/>
      <stop offset="100%" stop-color="#0055FF"/>
    </linearGradient>

    <!-- Right Wing: Electric Magenta / Solar Coral -->
    <linearGradient id="facet-magenta" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#FF007A"/>
      <stop offset="60%" stop-color="#7928CA"/>
      <stop offset="100%" stop-color="#4A00E0"/>
    </linearGradient>

    <!-- Central Core / Apex Prism -->
    <linearGradient id="facet-center" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="30%" stop-color="#C4F1F9"/>
      <stop offset="100%" stop-color="#00B4D8"/>
    </linearGradient>

    <!-- Bottom Bridge / Crossbar -->
    <linearGradient id="facet-bridge" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="50%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#FF007A"/>
    </linearGradient>

    <!-- Inner Core Refraction Glow -->
    <radialGradient id="inner-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#7928CA" stop-opacity="0"/>
    </radialGradient>

    <!-- Soft Drop Shadow Filter -->
    <filter id="shadow-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#00F0FF" flood-opacity="0.35"/>
      <feDropShadow dx="0" dy="16" stdDeviation="28" flood-color="#FF007A" flood-opacity="0.25"/>
    </filter>

    <filter id="subtle-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="32"/>
    </filter>
  </defs>

  <!-- Background Base Container -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bg-glow)"/>
  <rect x="16" y="16" width="480" height="480" rx="108" fill="none" stroke="url(#border-glow)" stroke-width="3.5" opacity="0.85"/>

  <!-- Ambient Light Reflection in Center -->
  <circle cx="256" cy="230" r="140" fill="url(#inner-glow)" filter="url(#subtle-blur)" opacity="0.6"/>

  <!-- Main Polyhedral "A" Glyph with Lighting -->
  <g filter="url(#shadow-glow)">
    <!-- Left Pillar (Cyan Facet) -->
    <polygon points="256,92 256,196 142,352 96,352" fill="url(#facet-cyan)"/>

    <!-- Right Pillar (Magenta/Violet Facet) -->
    <polygon points="256,92 256,196 370,352 416,352" fill="url(#facet-magenta)"/>

    <!-- Center Apex Triangle (Luminous Crystal) -->
    <polygon points="256,92 210,196 302,196" fill="url(#facet-center)" opacity="0.95"/>

    <!-- Inner Hollow Inverted Triangle -->
    <polygon points="256,228 198,310 314,310" fill="#0B0E17" opacity="0.92"/>

    <!-- Floating Crossbar Beam (The Runtime Engine Spark) -->
    <polygon points="172,284 340,284 322,316 190,316" fill="url(#facet-bridge)"/>

    <!-- High-light Refraction Accent Line -->
    <path d="M256 92 L256 196" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>
    <path d="M256 92 L96 352" stroke="#FFFFFF" stroke-width="1.5" opacity="0.4"/>
    <path d="M256 92 L416 352" stroke="#FFFFFF" stroke-width="1.5" opacity="0.4"/>
  </g>

  <!-- Brand Typography -->
  <g transform="translate(0, 442)">
    <text x="256" y="0"
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif"
          font-size="34" font-weight="900" letter-spacing="10" text-anchor="middle"
          fill="#FFFFFF" opacity="0.95">ALUKA</text>
  </g>
</svg>
